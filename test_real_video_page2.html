body,html{font-family:Roboto,sans-serif;margin:0;padding:0;height:100%;background:#000}

.plyr--full-ui input[type=range]::-webkit-slider-thumb{background:#fe6081!important}
.plyr--full-ui input[type=range]::-moz-range-thumb{background:#fe6081!important}
.plyr--full-ui input[type=range]::-ms-thumb{background:#fe6081!important}
.plyr__control--overlaid,.plyr__progress__fill{background:#fe6081!important}
.player-container{position:fixed;inset:0;width:100vw;height:100vh;background:#000}
.player-container .plyr,.plyr__video-wrapper,video{width:100%;height:100%}
video{object-fit:contain;background:#000;display:block}
.plyr__controls{opacity:1!important;visibility:visible!important}

.plyr{
  position: relative;
}
 
.plyr__top-controls{
  position: absolute;
  top: 10px;
  right: 10px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  z-index: 4;
 
  opacity: 1;
  transform: translateY(0);
  transition: opacity .18s ease, transform .18s ease;
  pointer-events: auto;
}
 
.plyr--full-ui.plyr--hide-controls .plyr__top-controls{
  opacity: 0;
  transform: translateY(-6px);
  pointer-events: none;  
}
 
.plyr__top-controls,
.plyr__top-controls .plyr__control{
  color: #fff !important;
}
 
.plyr__top-controls .plyr__control{
  background: rgba(0,0,0,.1);
  border-radius: 10px;
  padding: 7px;
}
 
.plyr__top-controls .plyr__control:hover{
  background: rgba(0,0,0,.75);
}

<div class="player-container">
  <video id="player" class="plyr" playsinline controls preload="none"
         poster="https://i.vid30s.com/image/mzYF9ikr1Q.jpg">
    <source src="https://m.imgvdy.com/mzYF9ikr1Q-2XoPIu6PKA" type="video/mp4"/>
  </video>
</div>
<script src="/player.js"></script>
<script>
const VIDEO_ID = "p4wthn6p0pro";
const video = document.getElementById('player');
const STORAGE_KEY = "plyr_progress_" + VIDEO_ID;
const player = new Plyr(video, {
  controls: ['play-large','play','progress','current-time','duration','mute','settings','pip','fullscreen'],
  hideControls: true,
  clickToPlay: true,
  fullscreen: { enabled: true, fallback: true, iosNative: true }
});

      
player.on('loadedmetadata', () => {
  const savedTime = localStorage.getItem(STORAGE_KEY);

  if (savedTime && !isNaN(savedTime)) {
   
    if (savedTime > 5 && savedTime < player.duration - 10) {
      player.currentTime = Number(savedTime);
    }
  }
});

 
let lastSaved = 0;

player.on('timeupdate', () => {
  const current = Math.floor(player.currentTime);

  if (current - lastSaved >= 3) {
    localStorage.setItem(STORAGE_KEY, current);
    lastSaved = current;
  }
});

player.on('ended', () => {
  localStorage.removeItem(STORAGE_KEY);
});




player.on('ready', () => {
  const plyr = player.elements.container;

  let topControls = document.createElement('div');
  topControls.className = 'plyr__top-controls';

  const muteBtn = plyr.querySelector('[data-plyr="mute"]');
  const settingsBtn = plyr.querySelector('[data-plyr="settings"]');


  if (muteBtn) topControls.appendChild(muteBtn);
  if (settingsBtn) topControls.appendChild(settingsBtn);

  plyr.appendChild(topControls);
});

</script>
